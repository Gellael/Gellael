<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#8da2c0" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9d" stop-opacity="0"/><stop offset="0.5" stop-color="#00ff9d" stop-opacity="1"/><stop offset="1" stop-color="#00ff9d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-260px); } 100% { transform: translateX(1000px); } }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; opacity: 0; } }
  </style>
  <rect x="0" y="11" width="1000" height="1.5" fill="url(#base)"/>
  <rect class="sweep" x="0" y="10.5" width="260" height="2.5" rx="1.25" fill="url(#pulse)"/>
  <circle cx="500" cy="11.75" r="3" fill="#0d1117" stroke="#00ff9d" stroke-opacity="0.7" stroke-width="1.2"/>
</svg>
